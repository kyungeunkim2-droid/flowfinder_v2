<style>
  :root {
    --ff-mint: #2ef2c9;
    --ff-navy: #02060a;
    --ff-panel: rgba(10, 24, 38, 0.65);
    --ff-border: rgba(46, 242, 201, 0.15);
    --mouse-x: 50%;
    --mouse-y: 50%;
  }

  body {
    background-color: var(--ff-navy);
    color: #f8fffd;
    font-family: 'Inter', 'Pretendard', system-ui, -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
    margin: 0;
  }

  /* Full Screen Visualization Background from SCREEN_9 */
  #immersive-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), #1a2b3c 0%, #02060a 100%);
    transition: background 0.5s ease-out;
    overflow: hidden;
  }

  #immersive-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(125deg, rgba(46, 242, 201, 0.05), transparent, rgba(26, 43, 60, 0.2));
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    pointer-events: none;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .particle {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.3;
    pointer-events: none;
  }

  @keyframes float {
    0% { transform: translate(0, 0); opacity: 0.2; }
    50% { transform: translate(20px, -30px); opacity: 0.5; }
    100% { transform: translate(-10px, -60px); opacity: 0.2; }
  }

  /* 3-Column Dashboard Layout */
  #dashboard-container {
    position: relative;
    z-index: 10;
    display: grid;
    grid-template-columns: minmax(360px, 28%) minmax(480px, 42%) minmax(380px, 30%);
    height: 100vh;
    gap: 16px;
    padding: 16px;
    box-sizing: border-box;
  }

  /* Shared Column Styles - Glassmorphism from SCREEN_5 */
  .dashboard-col {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--ff-panel);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid rgba(46, 242, 201, 0.1);
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }

  /* Animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .reveal-stagger > * {
    opacity: 0;
    animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  .reveal-stagger > *:nth-child(1) { animation-delay: 0.1s; }
  .reveal-stagger > *:nth-child(2) { animation-delay: 0.2s; }
  .reveal-stagger > *:nth-child(3) { animation-delay: 0.3s; }

  /* Left Column: AI Chat */
  #chat-panel { background: var(--ff-panel); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--ff-mint) transparent;
  }
  .msg.bot .bubble { 
    background: rgba(25, 41, 56, 0.6); 
    border: 1px solid var(--ff-border); 
    border-radius: 6px 22px 22px 22px; 
    padding: 16px 20px; 
    font-size: 14px; 
    line-height: 1.7; 
    color: #e2e8f0;
  }
  .msg.user .bubble { 
    background: linear-gradient(135deg, var(--ff-mint), #7257f2); 
    color: #fff; 
    border-radius: 22px 22px 6px 22px; 
    padding: 14px 18px; 
    font-size: 14px; 
    align-self: flex-end; 
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  /* Chat Input Pulse Animation from SCREEN_5 */
  #user-input {
    transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    backdrop-filter: blur(5px);
  }
  #user-input:focus {
    background: rgba(255, 255, 255, 0.12);
    border-color: var(--ff-mint);
    animation: pulse-glow 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
  }

  @keyframes pulse-glow {
    0% { box-shadow: 0 0 15px 0px rgba(46, 242, 201, 0.2); }
    50% { box-shadow: 0 0 45px 5px rgba(46, 242, 201, 0.45); }
    100% { box-shadow: 0 0 15px 0px rgba(46, 242, 201, 0.2); }
  }

  /* Middle Column: Configuration */
  #config-panel {
    padding: 24px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--ff-mint) transparent;
  }
  .config-section-title { 
    font-family: 'Playfair Display', serif;
    font-size: 20px; 
    font-weight: 900; 
    color: #fff; 
    margin-bottom: 24px; 
    display: flex; 
    align-items: center; 
    gap: 12px; 
  }
  .config-section-title span { color: var(--ff-mint); }

  /* Right Column: Visualization */
  #viz-panel {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }

  /* Flow Bar Styling */
  #flow-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    padding: 8px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 16px;
    margin-bottom: 24px;
  }
  .flow-step {
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    background: transparent;
    color: var(--ff-muted);
    border: 1px solid transparent;
    transition: all 0.3s;
  }
  .flow-step.active { background: var(--ff-mint); color: var(--ff-navy); border-color: var(--ff-mint); box-shadow: 0 0 15px rgba(46, 242, 201, 0.3); }
  .flow-step.done { color: var(--ff-mint); border-color: rgba(46, 242, 201, 0.2); }

  /* Buttons & Controls Polish */
  .action-btn {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 18px;
  }
  .action-btn:hover {
    border-color: var(--ff-mint);
    background: rgba(46, 242, 201, 0.05);
    transform: translateY(-4px);
    box-shadow: 0 10px 30px -10px rgba(46, 242, 201, 0.3);
  }
  .action-btn.active {
    background: var(--ff-mint);
    color: var(--ff-navy);
    border-color: var(--ff-mint);
    box-shadow: 0 0 20px rgba(46, 242, 201, 0.4);
  }
  
  .preview-hero-card {
    background: rgba(0, 0, 0, 0.4);
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--ff-border);
    aspect-ratio: 4/3;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
  }

  .ff-clean-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--ff-border);
    border-radius: 24px;
    padding: 20px;
    backdrop-filter: blur(10px);
  }

  .parallax-target {
    transition: transform 0.15s ease-out;
    will-change: transform;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(46, 242, 201, 0.3); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ff-mint); }
</style>

<script>
  // Particle & Parallax System
  document.addEventListener('DOMContentLoaded', () => {
    const bg = document.getElementById('immersive-bg');
    const particleCount = 45;
    
    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 2 + 1;
      p.style.width = `${size}px`;
      p.style.height = `${size}px`;
      p.style.left = `${Math.random() * 100}%`;
      p.style.top = `${Math.random() * 100}%`;
      const duration = Math.random() * 20 + 15;
      const delay = Math.random() * 10;
      p.style.animation = `float ${duration}s ease-in-out ${delay}s infinite alternate`;
      bg.appendChild(p);
    }

    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) * 100;
      const y = (e.clientY / window.innerHeight) * 100;
      document.documentElement.style.setProperty('--mouse-x', `${x}%`);
      document.documentElement.style.setProperty('--mouse-y', `${y}%`);
      
      const moveX = (e.clientX - window.innerWidth / 2) / 80;
      const moveY = (e.clientY - window.innerHeight / 2) / 80;
      document.querySelectorAll('.parallax-target').forEach(t => {
        t.style.transform = `translate(${moveX}px, ${moveY}px)`;
      });
    });

    // Mock init message
    addMsg('bot', '<b>FlowFinder Immersive Studio</b>에 오신 것을 환영합니다. <br>단순한 공간을 넘어, 당신의 페르소나를 담은 업무 공간을 함께 설계해 보겠습니다. <br><br>먼저 구상 중이신 데스크의 레이아웃을 선택해 주십시오.');
    updateFlowBar();
  });

  // State Management
  window.state = {
    step: 'init', 
    current: {}, 
    cartItems: [], 
    history: [], 
    selectedCategories: [], 
    currentCatIdx: 0,
    _sessionId: 0
  };

  function addMsg(who, html) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${who} flex flex-col ${who === 'user' ? 'items-end' : 'items-start'} reveal-stagger`;
    div.innerHTML = `<div class="bubble">${html}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function handleSend() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;
    addMsg('user', text);
    input.value = '';
    // Preserve core logic flow
  }

  function updateFlowBar() {
    const bar = document.getElementById('flow-bar');
    if (!bar) return;
    const steps = ['레이아웃', '규격 설정', '재질 큐레이션', '최종 검토', '견적 확정'];
    bar.innerHTML = '';
    steps.forEach((label, i) => {
      const btn = document.createElement('button');
      btn.className = 'flow-step ' + (i === 0 ? 'active' : 'pending');
      btn.textContent = label;
      bar.appendChild(btn);
    });
  }

  function closePreviewModal(e) {
    document.getElementById('preview-modal').classList.add('hidden');
  }

  // Bridging existing logic
  // (All calculation, API integration, and product mapping logic should be kept from DOCUMENT_1 here)
</script>
